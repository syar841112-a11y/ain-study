<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공부방">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>아인이 공부방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: 햇살 드는 공부방. 데스크톱은 왼쪽 책장 같은 사이드바 + 본문, 휴대폰은 상단 바 + 하단 탭. 홈 위쪽 창밖 풍경이 유일한 큰 장식 */
:root {
  --bg: #EEF1E7;
  --surface: #FFFEF9;
  --sunken: #E5E9DD;
  --ink: #23302B;
  --muted: #5E6B63;
  --faint: #8A958D;
  --line: #DCE2D4;
  --accent: #3E7560;
  --accent-ink: #FFFEF9;
  --accent-soft: #DDEBE2;
  --sun: #F2B33D; --sun-soft: #FCEFCF;
  --rose: #DE7F72; --rose-soft: #F9E3DE;
  --sky: #5F86C4; --sky-soft: #E1EAF7;
  --paper: #FFF9E8;
  --c-text: #5F86C4;
  --c-hw: #DE7F72;
  --c-aca: #3E7560;
  --c-etc: #A57BC4;
  --s-eng: #4F79BC; --s-eng-w: #E1EAF7;
  --s-math: #3A8F72; --s-math-w: #DDEFE5;
  --s-kor: #D06C5E; --s-kor-w: #F9E3DE;
  --s-soc: #C58A1E; --s-soc-w: #FBEFD3;
  --s-sci: #2F8FA3; --s-sci-w: #DCEFF3;
  --s-etc: #9469B8; --s-etc-w: #EFE6F6;
  --ok: #3A8F72;
  --warn: #C58A1E;
  --danger: #C2554A;
  --heat-0: #E5E9DD; --heat-1: #F9E4AC; --heat-2: #F4C863; --heat-3: #E9A535; --heat-4: #CF8318;
  --shadow: 0 1px 2px rgba(35,48,43,.05), 0 10px 28px rgba(62,90,70,.08);
  --f-ui: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-read: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --f-num: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
  --f-hand: "Nanum Pen Script", "Gowun Dodum", cursive;
  --side-w: 252px;
  --nav-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151C19; --surface: #1C2521; --sunken: #232E29; --ink: #ECEFE6; --muted: #A3B0A7; --faint: #74817A; --line: #2C3832;
    --accent: #8CC7AA; --accent-ink: #151C19; --accent-soft: #24382F;
    --sun: #F3C25C; --sun-soft: #3A321C; --rose: #EE9A8E; --rose-soft: #3E2724; --sky: #8FB0E3; --sky-soft: #22304A; --paper: #2A2A20;
    --c-text: #8FB0E3; --c-hw: #EE9A8E; --c-aca: #8CC7AA; --c-etc: #C6A3E2;
    --s-eng: #8FB0E3; --s-eng-w: #22304A; --s-math: #7FC9A9; --s-math-w: #1D3229; --s-kor: #EE9A8E; --s-kor-w: #3E2724;
    --s-soc: #EBC06A; --s-soc-w: #3A321C; --s-sci: #73C4D6; --s-sci-w: #17323A; --s-etc: #C6A3E2; --s-etc-w: #30263E;
    --ok: #7FC9A9; --warn: #EBC06A; --danger: #F08A80;
    --heat-0: #232E29; --heat-1: #4A4324; --heat-2: #7A6529; --heat-3: #B38A30; --heat-4: #F3C25C;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151C19; --surface: #1C2521; --sunken: #232E29; --ink: #ECEFE6; --muted: #A3B0A7; --faint: #74817A; --line: #2C3832;
  --accent: #8CC7AA; --accent-ink: #151C19; --accent-soft: #24382F;
  --sun: #F3C25C; --sun-soft: #3A321C; --rose: #EE9A8E; --rose-soft: #3E2724; --sky: #8FB0E3; --sky-soft: #22304A; --paper: #2A2A20;
  --c-text: #8FB0E3; --c-hw: #EE9A8E; --c-aca: #8CC7AA; --c-etc: #C6A3E2;
  --s-eng: #8FB0E3; --s-eng-w: #22304A; --s-math: #7FC9A9; --s-math-w: #1D3229; --s-kor: #EE9A8E; --s-kor-w: #3E2724;
  --s-soc: #EBC06A; --s-soc-w: #3A321C; --s-sci: #73C4D6; --s-sci-w: #17323A; --s-etc: #C6A3E2; --s-etc-w: #30263E;
  --ok: #7FC9A9; --warn: #EBC06A; --danger: #F08A80;
  --heat-0: #232E29; --heat-1: #4A4324; --heat-2: #7A6529; --heat-3: #B38A30; --heat-4: #F3C25C;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; flex: none; }

/* Shell */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
aside.side {
  position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--surface); border-right: 1px solid var(--line);
  padding: 22px 14px 24px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-read); font-weight: 700; font-size: 17px; }
.brand b { font-size: 16px; display: block; line-height: 1.2; }
.brand small { color: var(--faint); font-size: 12px; }
.nav-group { display: grid; gap: 2px; }
.nav-group > span { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--faint); padding: 0 10px 6px; text-transform: uppercase; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 10px; border: 0; background: none;
  cursor: pointer; text-align: left; color: var(--muted); font-weight: 500;
}
.nav-btn:hover { background: var(--sunken); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-btn .badge { margin-left: auto; font-family: var(--f-num); font-size: 11px; background: var(--c-hw); color: #fff; border-radius: 999px; padding: 0 7px; line-height: 18px; }

main.view {
  min-width: 0; padding-block: 28px 48px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
h1 { font-size: clamp(24px, 3.4vw, 30px); font-weight: 700; margin: 4px 0 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 700; margin: 0; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.topbar { display: none; }
nav.tabbar { display: none; }

/* Common */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.lg { min-height: 48px; padding: 0 22px; font-size: 16px; border-radius: 12px; }
.btn.danger { color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: progress; }
.btn svg.i { width: 17px; height: 17px; }
.seg { display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--faint)); }
.chip .n { font-family: var(--f-num); font-size: 11px; color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--w, var(--sunken)); color: var(--c, var(--muted)); white-space: nowrap; }
.meta { font-size: 13px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px 18px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty b { color: var(--ink); font-size: 15px; }
.empty .btn { margin-top: 6px; }
label.f { display: grid; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type=text], input[type=url], input[type=search], input[type=date], input[type=number], select, textarea {
  width: 100%; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
textarea { padding: 10px 12px; min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; }
.status.err { color: var(--danger); }
.status.ok { color: var(--ok); }
.list { display: grid; }
.list > * + * { border-top: 1px solid var(--line); }
.divider { height: 1px; background: var(--line); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi span { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi b { font-family: var(--f-num); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi b small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 2px; }

/* Home */
.hello { display: grid; gap: 4px; }
.hello .date { font-family: var(--f-num); font-size: 12px; color: var(--faint); letter-spacing: .04em; }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; text-align: left; cursor: pointer; display: grid; gap: 8px; color: var(--ink); }
.quick button:hover { border-color: var(--accent); }
.quick button svg.i { color: var(--accent); }
.quick button b { font-size: 14px; }
.quick button small { color: var(--faint); font-size: 12px; }

/* Materials */
.book { display: grid; gap: 8px; }
.book-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.book-head h3 { font-size: 16px; }
.mat { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 4px; }
.mat .ico { width: 40px; height: 48px; border-radius: 4px 8px 8px 4px; background: var(--w); color: var(--c); display: grid; place-items: center; font-family: var(--f-num); font-size: 10px; font-weight: 600; border-left: 4px solid var(--c); }
.mat .t { font-weight: 600; overflow-wrap: anywhere; }
.mat .actions { display: flex; gap: 6px; }
.chapter-label { font-size: 12px; font-weight: 600; color: var(--faint); padding: 10px 4px 0; letter-spacing: .04em; }

/* Broadcast */
.cast { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 4px; }
.cast .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--w, var(--accent-soft)); color: var(--c, var(--accent)); }
.cast audio { width: 100%; margin-top: 8px; height: 36px; }

/* Articles */
.articles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.article { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.article h3 { font-family: var(--f-read); font-size: 18px; font-weight: 700; line-height: 1.45; text-wrap: balance; }
.article p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
.article .q { background: var(--sunken); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--ink); }
.article .q b { color: var(--accent); margin-right: 6px; }
.lic { font-size: 11px; color: var(--faint); }

/* Dictionary */
.dict-box { display: flex; gap: 8px; }
.dict-box input { min-height: 52px; font-size: 18px; flex: 1; min-width: 0; }
.word { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 4px; }
.word b { font-size: 16px; }
.word small { color: var(--muted); display: block; }

/* Books */
.store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.rank { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 8px 2px; align-items: baseline; }
.rank .n { font-family: var(--f-num); font-weight: 600; color: var(--faint); text-align: right; }
.rank:nth-child(-n+3) .n { color: var(--accent); }
.rank a { text-decoration: none; font-weight: 600; }
.rank a:hover { text-decoration: underline; }
.rank small { display: block; color: var(--faint); font-size: 12px; }

/* Music */
.music-hero { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 24px; display: grid; gap: 14px; }
.music-hero .lede { color: inherit; opacity: .7; }
.music-hero form { display: flex; gap: 8px; }
.music-hero input { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); color: inherit; min-height: 48px; font-size: 16px; flex: 1; min-width: 0; }
.music-hero input::placeholder { color: inherit; opacity: .55; }
.music-hero .btn { background: var(--bg); color: var(--ink); border-color: var(--bg); }
.rest-art { position: relative; margin: 0; border-radius: 22px; overflow: hidden; aspect-ratio: 16 / 9; background: #F3E3C8; box-shadow: 0 14px 32px rgba(60, 40, 20, .14); }
.rest-art img { width: 100%; height: 100%; object-fit: cover; display: block; animation: restDrift 28s ease-in-out infinite alternate; transform-origin: 40% 50%; }
@keyframes restDrift { from { transform: scale(1); } to { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .rest-art img { animation: none; } }
.rest-art figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 22px 18px; background: linear-gradient(transparent, rgba(40, 26, 16, .55)); color: #FFF8EC; display: grid; gap: 2px; }
.rest-art figcaption b { font-family: var(--f-hand); font-weight: 400; font-size: 32px; line-height: 1.1; }
.rest-art figcaption span { font-size: 14px; opacity: .92; }
@media (max-width: 520px) { .rest-art { aspect-ratio: 4 / 3; border-radius: 18px; } .rest-art figcaption b { font-size: 26px; } }
.mood-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.mood { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 1 / 1; text-decoration: none; display: grid; align-content: end; padding: 14px; color: #fff; background: var(--mc); max-width: 100%; }
.mood canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.mood .lbl { position: relative; display: grid; gap: 2px; }
.mood .lbl b { font-size: 16px; }
.mood .lbl small { font-size: 12px; opacity: .85; }
.mood:hover { outline: 2px solid var(--accent); outline-offset: 2px; }
.pl-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; }
.pl-row .cover { width: 40px; height: 40px; border-radius: 8px; background: var(--sunken); display: grid; place-items: center; color: var(--muted); }
.pl-row a.t { text-decoration: none; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

/* Homework */
.hw { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 4px; }
.hw input[type=checkbox] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--ok); cursor: pointer; }
.hw .t { font-weight: 600; }
.hw.done .t { text-decoration: line-through; color: var(--faint); }
.hw p { margin: 4px 0 0; font-size: 14px; color: var(--muted); white-space: pre-wrap; }
.due { font-family: var(--f-num); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.due.soon { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.due.late { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }

/* Footprints */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dow { font-size: 11px; color: var(--faint); text-align: center; font-weight: 600; }
.cal button { aspect-ratio: 1 / 1; border: 0; border-radius: 10px; background: var(--heat-0); cursor: pointer; display: grid; align-content: space-between; padding: 6px; text-align: left; color: var(--ink); min-width: 0; max-width: 100%; }
.cal button .d { font-family: var(--f-num); font-size: 12px; font-weight: 600; }
.cal button .m { font-family: var(--f-num); font-size: 10px; opacity: .85; text-align: right; }
.cal button[data-h="1"] { background: var(--heat-1); }
.cal button[data-h="2"] { background: var(--heat-2); }
.cal button[data-h="3"] { background: var(--heat-3); }
.cal button[data-h="4"] { background: var(--heat-4); color: var(--surface); }
.cal button.out { visibility: hidden; }
.cal button.today { box-shadow: inset 0 0 0 2px var(--ink); }
.cal button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 2px var(--accent-soft); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; min-width: 560px; width: 100%; height: auto; }
.log { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; }
.log .bar { width: 6px; height: 34px; border-radius: 3px; background: var(--lc); }
.log .t { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.log .mins { font-family: var(--f-num); font-weight: 600; }

/* Timer */
.timer-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 20px; display: grid; gap: 22px; justify-items: center; text-align: center; }
.timer-face { font-family: var(--f-num); font-size: clamp(56px, 13vw, 104px); font-weight: 500; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.timer-face.run { color: var(--accent); }
.ring { width: min(100%, 320px); height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.ring > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s linear; }

/* Viewer */
[hidden] { display: none !important; }
.viewer { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.viewer-bar {
  background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.viewer-bar .vt { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer-bar .vt small { display: block; font-weight: 500; font-size: 12px; color: var(--faint); font-family: var(--f-num); }
.viewer-body { overflow: auto; padding: 16px max(12px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: grid; justify-items: center; align-content: start; gap: 14px; }
.viewer-body canvas { background: #fff; box-shadow: var(--shadow); border-radius: 3px; max-width: none; display: block; }
.viewer-body img { max-width: 100%; background: #fff; }
.viewer-msg { color: var(--muted); padding: 40px 0; text-align: center; }
.more-pages { display: grid; justify-items: center; gap: 8px; padding: 8px 0 24px; color: var(--muted); font-size: 13px; }

/* Sheet (mobile menu + save dialog) */
.scrim { position: fixed; inset: 0; background: rgba(10,12,16,.45); z-index: 70; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--surface); width: min(560px, 100%); border-radius: 20px 20px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 88vh; overflow: auto; }
.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; }
.menu-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.menu-grid button { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px 8px; display: grid; gap: 6px; justify-items: center; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); }
.menu-grid button svg.i { color: var(--accent); width: 22px; height: 22px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 90; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* Responsive */
@media (max-width: 980px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside.side { display: none; }
  .topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--surface); }
  .topbar b { font-size: 16px; }
  main.view { padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  nav.tabbar {
    display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  nav.tabbar .inner { display: grid; grid-template-columns: repeat(6, 1fr); height: var(--nav-h); max-width: 560px; margin: 0 auto; }
  nav.tabbar button { border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--faint); cursor: pointer; }
  nav.tabbar button[aria-current="page"] { color: var(--accent); }
  .grid-2, .grid-3, .articles { grid-template-columns: minmax(0, 1fr); }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .mat { grid-template-columns: 34px minmax(0, 1fr); }
  .mat .ico { width: 34px; height: 42px; }
  .mat .actions { grid-column: 1 / -1; }
  .mat .actions .btn { flex: 1; }
  .cast { grid-template-columns: 40px minmax(0, 1fr); }
  .cast > .act { grid-column: 1 / -1; }
  .cal { gap: 4px; }
  .cal button { padding: 4px; border-radius: 8px; }
  .cal button .m { display: none; }
  .music-hero form, .dict-box { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { .ring > i { transition: none; } }
/* ---- Warm theme layer ---- */

h1 { font-size: clamp(26px, 3.6vw, 34px); line-height: 1.25; }

aside.side { background: var(--surface); }
.nav-btn { border-radius: 12px; font-size: 15px; }

.seg button { font-weight: 400; }
.tag { font-weight: 400; border-radius: 8px; }
label.f { font-weight: 400; }

.ph { display: flex; gap: 16px; align-items: center; }

/* Home scene */

.scene svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }

.scene h1 { margin-top: 2px; max-width: 18ch; }

/* Dad's note (용선생 한마디) */
.note { background: var(--paper); border: 1px solid color-mix(in srgb, var(--sun) 35%, var(--line)); border-radius: 6px 22px 22px 22px; position: relative; }
.note::before { content: ""; position: absolute; top: -9px; left: 26px; width: 72px; height: 18px; background: color-mix(in srgb, var(--sun) 55%, transparent); transform: rotate(-3deg); border-radius: 3px; }

/* Music hero: fixed deep forest look in both themes */

/* Timer & calendar */

.timer-face { font-family: var(--f-read); font-weight: 700; letter-spacing: -0.02em; }
.ring { height: 10px; border-radius: 5px; }

.toast { border-radius: 14px; }
.scene.photo { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); padding: 0; background: var(--paper); color: var(--ink); border: 1px solid var(--line); min-height: 270px; }

/* Broadcast week strip & vocab player */

.mh-av.sel { filter: drop-shadow(0 0 4px rgba(62, 117, 96, .9)); }

.mh-who { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mh-whobtn { display: grid; justify-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg); border-radius: 16px; padding: 12px 6px; cursor: pointer; font: inherit; color: var(--ink); }

.mh-mini { display: flex; gap: 16px; align-items: flex-start; }
.mh-gline { display: grid; } .mh-gline small { color: var(--muted); font-size: 11.5px; } .mh-gline span { font-family: var(--f-hand); font-size: 20px; line-height: 1.25; }

.mh-sw { min-width: 30px; height: 30px; border-radius: 999px; border: 2px solid var(--line); background: var(--sw, var(--bg)); cursor: pointer; font: inherit; font-size: 12.5px; padding: 0 10px; color: var(--ink); }

@media (max-width: 820px) {

.wt { grid-template-rows: auto minmax(0, 1fr) auto; }

.wt-score { font-family: var(--f-read); font-size: 60px; font-weight: 700; line-height: 1; color: var(--accent); }
.wt-score small { font-size: 20px; margin-left: 2px; }

@keyframes wt-pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .wt-praise-emo { animation: none; } }
.wt-r { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }

.wt-dots i.on { background: var(--ok); }
.wt-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }

.wt-kpi b { font-family: var(--f-num); font-size: 24px; line-height: 1.2; }
.wt-kpi small { font-size: 11px; color: var(--faint); }
.wt-trend { width: 100%; height: auto; display: block; margin-top: 6px; }

.wt-trend .l { fill: var(--faint); font-size: 11px; font-family: var(--f-num); }
.wt-trend .goal-l { fill: var(--warn); }
.wt-trend .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.wt-trend .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.wt-trend .pt.good { fill: var(--sun); stroke: var(--warn); }
.wt-top { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.wt-top li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.wt-table { display: grid; gap: 2px; }
.wt-tr { display: grid; grid-template-columns: minmax(0, 2fr) 0.6fr 0.8fr minmax(0, 1.6fr); gap: 8px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }

.wt-pend { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
@media (max-width: 560px) {
  .wt-item { grid-template-columns: 26px minmax(0, 1fr); }
  .wt-item .wt-in { grid-column: 1 / -1; }
  .wt-r { grid-template-columns: 26px minmax(0, 1fr); }

  .wt-tr { grid-template-columns: minmax(0, 1.6fr) 0.5fr 0.7fr minmax(0, 1.4fr); font-size: 13px; }
  .wt-foot .btn { width: 100%; }
}

  const BL = { map: {}, q: new Set(), t: null, waiters: {}, busy: false };

  function queueBlob(id) { if (!id || BL.map[id] && BL.map[id].exp > Date.now()) return; BL.q.add(id); clearTimeout(BL.t); BL.t = setTimeout(flushBlobs, 25); }

  const ensureBlob = (id) => { const u = blobUrl(id); if (u) return Promise.resolve(u); return new Promise(res => { (BL.waiters[id] = BL.waiters[id] || []).push(res); queueBlob(id); }); };

  // 자료가 들어오면 거기 걸린 파일 주소를 미리 받아 둔다(아이폰에서 누르자마자 재생되도록)
  function prefetchFrom(data) {

  const local = (col, id, data) => { if (!cache[col]) return; if (data === null) cache[col].delete(id); else { cache[col].set(id, data); prefetchFrom(data); } emit(col); };
  const rid = () => { const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; let s = ''; const r = crypto.getRandomValues(new Uint8Array(20)); r.forEach(x => s += a[x % a.length]); return s; };

  const st = document.createElement('style'); st.textContent = css; document.head.append(st);
  const NAMES = { ain: '아인이', dad: '아빠', mom: '엄마' };
  function gate(msg) {

    whoChip();

  /* ---------- 시험 화면 ---------- */

  /* ---------- 오답노트 기록 ---------- */
  async function wtUpdateNotes(res) {
    for (const a of res.answers) {
      if (a.ok === 'check') continue;
      const id = a.noteId || wnId(res.type, a.word), cur = S.wrongnotes.find(x => x.id === id);
      try {
        if (a.ok === 'wrong') {
          await S.db.collection('wrongnotes').doc(id).set({ type: res.type, word: a.word, ko: a.ko, accept: a.accept || null, testId: cur ? cur.testId : res.testId, testTitle: cur ? cur.testTitle : res.title,
            wrongCount: (cur ? cur.wrongCount || 0 : 0) + 1, streak: 0, status: 'open', lastGiven: a.given, lastWrongAt: res.finishedAt, firstWrongAt: cur ? cur.firstWrongAt || res.finishedAt : res.finishedAt, memo: cur ? cur.memo || '' : '' });
        } else if (cur && cur.status !== 'done') {
          const streak = (cur.streak || 0) + 1;
          await S.db.collection('wrongnotes').doc(id).update({ streak, status: streak >= 2 ? 'done' : 'open', doneAt: streak >= 2 ? res.finishedAt : null, lastRightAt: res.finishedAt });
        }

  /* 아빠가 '확인 필요'나 오답을 직접 판정 */
  async function wtJudge(res, idx, ok) {
    const answers = res.answers.map((a, i) => i === idx ? { ...a, ok: ok ? 'ok' : 'wrong', judged: true } : a);
    const next = { ...stripId(res), answers, ...wtScore(answers) };
    try { await S.db.collection('testresults').doc(res.id).set(next); } catch (e) { toast('바꾸지 못했어요'); return null; }
    const a = answers[idx];
    if (ok) {
      const test = S.wordtests.find(x => x.id === res.testId);
      if (test && a.given) {
        const items = test.items.map(it => (it.word === a.word && it.ko === a.ko) ? { ...it, accept: Array.from(new Set([...wtAnswers(test.type, it), a.given])) } : it);
        try { await S.db.collection('wordtests').doc(test.id).update({ items }); } catch (e) {}
      }
      const nid = a.noteId || wnId(res.type, a.word), cur = S.wrongnotes.find(x => x.id === nid);
      if (cur && res.answers[idx].ok === 'wrong') { try { if ((cur.wrongCount || 1) <= 1) await S.db.collection('wrongnotes').doc(nid).delete(); else await S.db.collection('wrongnotes').doc(nid).update({ wrongCount: cur.wrongCount - 1 }); } catch (e) {} }
    } else if (res.answers[idx].ok !== 'wrong') await wtUpdateNotes({ ...res, answers: [a] });
    return { ...next, id: res.id };
  }
